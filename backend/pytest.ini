[pytest]
# ---------------------------------------------------------------------------
# ATS Resume Matcher — pytest configuration
# ---------------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# pytest-asyncio: run every `async def test_*` without a decorator.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session

addopts =
    -ra
    --strict-markers
    --tb=short
    --disable-warnings

markers =
    slow: tests that build models or run the full pipeline (deselect with -m "not slow")
    integration: end-to-end tests across several pipeline stages
    api: HTTP-level tests against the FastAPI app

filterwarnings =
    ignore::UserWarning
    ignore::FutureWarning
    ignore::DeprecationWarning

log_cli = false
